# Toutes les 2 h : publie la bande-annonce d'un film qui sort le mercredi qui vient (TikTok + Instagram).
name: bande-annonce du jour
on:
  schedule:
    # toutes les 2 h de 8h à 22h, heure de Paris en hiver (7h-21h UTC ; en été ce sera 9h-23h)
    - cron: "0 7-21/2 * * *"
  workflow_dispatch: {}      # bouton "Run workflow" pour lancer à la main
permissions:
  contents: write
  issues: write
concurrency:            # jamais deux lancements en même temps (sinon même film en double)
  group: bande-annonce
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with: { path: ~/.rembg, key: rembg-models }
      - run: python main.py --latest 1 --publish
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_MODE: ${{ vars.TIKTOK_MODE || 'draft' }}
          TIKTOK_PRIVACY: ${{ vars.TIKTOK_PRIVACY || 'SELF_ONLY' }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: videos, path: output/ }
      # Te prévient (notification GitHub + e-mail) avec le lien de la vidéo et la description à copier
      - name: vidéo à publier
        env: { GH_TOKEN: "${{ github.token }}" }
        run: python notify.py
      - name: mémorise les films déjà publiés
        run: |
          git config user.name "trailer-bot" && git config user.email "bot@users.noreply.github.com"
          git add posted.json assets/logos
          git diff --cached --quiet && { echo "rien à commiter"; exit 0; }
          git commit -m "publié : $(date +%F)"
          # si le dépôt a changé pendant le lancement, on récupère les nouveautés puis on renvoie (5 essais)
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep $((i * 5))
          done
          echo "::error::Impossible d'enregistrer posted.json : le même film risque d'être republié"; exit 1
