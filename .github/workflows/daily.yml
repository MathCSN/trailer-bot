# Prépare et envoie automatiquement la dernière bande-annonce chaque jour à 18h (heure de Paris).
name: bande-annonce du jour
on:
  schedule:
    - cron: "0 16 * * *"     # 16h UTC = 18h Paris (17h en heure d'hiver)
  workflow_dispatch: {}      # bouton "Run workflow" pour lancer à la main
permissions:
  contents: write
  issues: write
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with: { path: ~/.rembg, key: rembg-models }
      - run: python main.py --latest 1 --publish
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_MODE: ${{ vars.TIKTOK_MODE || 'draft' }}
          TIKTOK_PRIVACY: ${{ vars.TIKTOK_PRIVACY || 'SELF_ONLY' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: videos, path: output/ }
      # Ouvre un ticket avec la description à copier-coller (tu reçois une notif / un mail)
      - name: description à copier
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          for f in output/*.txt; do
            [ -e "$f" ] || continue
            gh issue create --title "🎬 $(head -1 "$f" | sed 's/^🎬 //')" --body-file "$f"
          done
      - name: mémorise les films déjà publiés
        run: |
          git config user.name "trailer-bot" && git config user.email "bot@users.noreply.github.com"
          git add posted.json && git commit -m "publié : $(date +%F)" && git push || echo "rien à commiter"
