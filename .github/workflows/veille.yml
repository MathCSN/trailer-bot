# Toutes les 15 min : regarde si une nouvelle bande-annonce vient de sortir (chaînes YouTube officielles
# des distributeurs + AlloCiné) et la publie aussitôt. Vérification légère : le montage ne s'installe
# que s'il y a vraiment une nouveauté.
name: veille des nouvelles bandes-annonces
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
concurrency:            # partagé avec « bande-annonce du jour » : jamais deux publications en même temps
  group: bande-annonce
  cancel-in-progress: false
jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install requests
      - id: check
        run: python news.py
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
      # --- seulement s'il y a une nouveauté à publier ---
      - if: steps.check.outputs.go == '1'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg && pip install -r requirements.txt
      - if: steps.check.outputs.go == '1'
        uses: denoland/setup-deno@v2      # yt-dlp en a besoin pour lire YouTube
        with: { deno-version: v2.x }
      - if: steps.check.outputs.go == '1'
        uses: actions/cache@v4
        with: { path: ~/.rembg, key: rembg-models }
      - if: steps.check.outputs.go == '1'
        run: python main.py --news --publish
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_MODE: ${{ vars.TIKTOK_MODE || 'draft' }}
          TIKTOK_PRIVACY: ${{ vars.TIKTOK_PRIVACY || 'SELF_ONLY' }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_TOKEN: ${{ github.token }}
      - if: steps.check.outputs.go == '1'
        uses: actions/upload-artifact@v4
        with: { name: videos, path: output/ }
      - if: steps.check.outputs.go == '1'
        name: vidéo à publier
        env: { GH_TOKEN: "${{ github.token }}" }
        run: python notify.py
      - name: mémorise ce qui a été vu / publié
        if: always()
        run: |
          git config user.name "trailer-bot" && git config user.email "bot@users.noreply.github.com"
          git add posted.json seen.json assets/logos
          git diff --cached --quiet && { echo "rien à commiter"; exit 0; }
          git commit -m "veille : $(date +%F' '%H:%M)"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep $((i * 5))
          done
          echo "::error::Impossible d'enregistrer posted.json : le même film risque d'être republié"; exit 1
