# Republie sur la Page Facebook une bande-annonce déjà publiée (Instagram et TikTok ne sont pas touchés).
name: republier sur Facebook
on:
  workflow_dispatch:
    inputs:
      film:
        description: "Titre du film (ou un morceau du titre)"
        required: true
permissions:
  contents: write
concurrency:
  group: bande-annonce
  cancel-in-progress: false
jobs:
  repost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg && pip install requests
      - run: python repost.py "$FILM"
        env:
          FILM: ${{ inputs.film }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
      - name: mémorise la publication
        run: |
          git config user.name "trailer-bot" && git config user.email "bot@users.noreply.github.com"
          git add posted.json
          git diff --cached --quiet && exit 0
          git commit -m "republié sur Facebook : ${{ inputs.film }}"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
